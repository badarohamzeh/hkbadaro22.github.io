<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Hamzeh Badaro</title>
    <meta name="description" content="Contact Hamzeh Badaro for AI, computational neuroscience, and research collaboration inquiries.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrap">
            <a href="index.html" class="brand" aria-label="Hamzeh Badaro home">
                <span class="brand-mark">HB</span>
                <span>Hamzeh Badaro</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a class="active" href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container page-shell narrow-shell">
        <section class="card contact-card">
            <h2>Contact me</h2>
            <p>
                Feel free to reach out about AI and computational neuroscience research, VR biofeedback collaborations, tutoring, or software engineering inquiries.
            </p>
            <p class="contact-meta">
                <strong>Email:</strong> <a href="mailto:hkbadaro22@cit.just.edu.jo">hkbadaro22@cit.just.edu.jo</a> &nbsp;•&nbsp;
                <strong>Phone:</strong> +962 77 540 1330
            </p>

            <div id="formFeedback" class="form-feedback" role="status" aria-live="polite"></div>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="visitor@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="country">Country <span class="required">*</span></label>
                    <select id="country" name="country">
                        <option value="">-- Select your country --</option>
                        <option value="Jordan">Jordan</option>
                        <option value="Saudi Arabia">Saudi Arabia</option>
                        <option value="United Arab Emirates">United Arab Emirates</option>
                        <option value="Palestine">Palestine</option>
                        <option value="Egypt">Egypt</option>
                        <option value="Qatar">Qatar</option>
                        <option value="Kuwait">Kuwait</option>
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comments">Comments <span class="required">*</span></label>
                    <textarea id="comments" name="comments" rows="5" placeholder="Write your message here..."></textarea>
                </div>

                <div class="button-row">
                    <button type="submit" class="button primary">Submit</button>
                    <button type="reset" class="button secondary">Reset</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Hamzeh Badaro • SID: 163343</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('contactForm');
        const feedback = document.getElementById('formFeedback');

        function showFeedback(message, isError) {
            feedback.textContent = message;
            feedback.classList.toggle('error', isError);
            feedback.classList.toggle('success', !isError);
            feedback.hidden = false;
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const country = document.getElementById('country').value.trim();
            const comments = document.getElementById('comments').value.trim();

            if (!fullName || !email || !country || !comments) {
                showFeedback('Please fill in all required fields before submitting.', true);
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                showFeedback('Please enter a valid email address.', true);
                return;
            }

            showFeedback(`Thank you, ${fullName}! Your message has been submitted successfully.`, false);
            form.reset();
        });
    </script>
</body>
</html>
